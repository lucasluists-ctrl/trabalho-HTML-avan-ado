<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Cadastro Enciclopedia ROBLOX">
    <meta name="keywords" content="Cadastro, Enciclopedia, ROBLOX">
    <meta name="author" content="Lucas Luis">
    <title>Cadastro Enciclopedia ROBLOX</title>
</head>

<body>
    <!-- Header e banner-->
    <header>
        <p align="center">
            <img src="gif/Enciclopedia ROBLOX.gif" alt="Enciclopédia Roblox" width="90%">
        </p>
    </header>
    <!--conteúdo principal-->
    <main>
        <section>
            <!-- tabela com 3 colunas -->
            <table width="100%" align="center">
                <tr>
                    <!-- coluna esquerda -->
                    <td width="25%" align="center">
                        <aside>
                            <img src="gif/cadastro gif.gif" alt="Imagem 1" width="50%">
                        </aside>
                    </td>
                    <!--coluna formulario -->
                    <td width="50%" align="center">
                        <article>
                            <fieldset>
                                <legend>
                                    <strong> Cadastra-se</strong>
                                </legend>

                                <h2>⊹₊˚‧︵Entre na maior enciclopédia do ROBLOX de graça !︵‧˚₊⊹</H2>

                                <p>
                                    crie seu perfil
                                </p>

                                <!-- Formulário de cadastro -->
                                <form action="html/inicio.html">

                                    <label for="nome">🌈✦ Nome:</label>
                                    <input type="text" name="nome" id="nome" required>

                                    <br>
                                    <br>


                                    <label for="email">🌈✦ Email:</label>
                                    <input type="email" name="email" id="email" required>

                                    <br>
                                    <br>

                                    <label for="senha">🌈✦ Senha:</label>
                                    <input type="password" name="senha" id="senha" required>

                                    <br>
                                    <br>

                                    <label for="data_nascimento">🌈✦ Data de Nascimento:</label>
                                    <input type="date" name="data_nascimento" id="data_nascimento" required>

                                    <br>
                                    <br>

                                    <label for="jogo_favorito">🌈✦ Jogo Favorito:</label>
                                    <input type="text" name="jogo_favorito" id="jogo_favorito" list="jogos"
                                        placeholder="Digite seu jogo favorito no Roblox">
                                    <!-- Lista de opções de jogos -->
                                    <datalist id="jogos">
                                        <option value="Adopt Me!">
                                        <option value="Dress to Impress">
                                        <option value="Tower of Hell">
                                        <option value="Arsenal">
                                        <option value="Murder Mystery 2">
                                    </datalist>

                                    <!-- ################################ -->

                                    <br>
                                    <br>

                                    <!-- Termos de serviço e política de privacidade -->
                                    <p align="center">Ao se cadastrar você concorda com nossos <a
                                            href="termos.html">Termos de Serviço</a> e <a
                                            href="privacidade.html">Política de Privacidade</a>.
                                    </p>

                                    <!-- Botão de envio -->
                                    <p align="center">
                                        <input type="submit" value="Cadastrar" style="width: 200px; height: 60px;">
                                    </p>

                                    <br>
                                    <br>

                                    <!-- finaliza formulario-->
                                </form>
                            </fieldset>
                        </article>

                        <!-- coluna direita -->
                    </td>
                    <td width="25%" align="center">
                        <aside>
                            <img src="gif/cadastro gif.gif" alt="Imagem 2" width="50%">
                        </aside>
                    </td>
                    <!-- finaliza coluna direita -->
                </tr>
                <!-- finaliza tabela -->
            </table>
            <!-- finaliza conteúdo principal -->
        </section>
    </main>
    <!-- rodapé -->
    <footer>
        <p align="center">
            <img src="gif/Final de Enciclopedia ROBLOX.gif" alt="Enciclopédia Roblox" width="90%">
        </p>
    </footer>
    <!-- finaliza corpo -->
</body>

</html>
