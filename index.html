<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Cadastro Enciclopedia ROBLOX">
    <meta name="keywords" content="Cadastro, Enciclopedia, ROBLOX">
    <meta name="author" content="Lucas Luis">
    <title>Cadastro Enciclopedia ROBLOX</title>
</head>
<body>
    <!-- banner roblox -->
    <header>
        <h1>Cadastro Enciclopedia ROBLOX</h1>
        <img
            src="gif/Enciclopedia ROBLOX.gif"
            alt="Logo Roblox"
            width="600"
        >
    </header>
    <!--conteúdo principal-->
    <main>

    <section>
    <table width="100%">
        <tr>
            <td width="25%" align="center">
                <aside>
                 <img src="gif/Enciclopedia ROBLOX.gif" alt="Imagem 1" width="100%">
                </aside>   
            </td>
<!--formulario -->
            <td width=”50%”>
            <article>
                <fieldset>
                <legend>
                    <strong> crie sua conta</strong>
                </legend>
                <h2>Entre na maior enciclopédia do Roblox de graça !</H2>
                <p>
                    crie seu perfil
                </p>
<!-- ############################-->
                <form action="index.html" method="post">

                    <label for="nome">Nome:</label>

                    <input type="text" name="nome" id="nome" required>

                    <br><br>

                    <label for="email">Email:</label>

                    <input type="email" name="email" id="email" required>

                    <br><br>
                    
                    <label for="senha">Senha:</label>

                    <input type="password" name="senha" id="senha" required>

                    <br><br>
                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input type="date" name="data_nascimento" id="data_nascimento" required>
                    <br><br>
                    <label for="jogo_favorito">Jogo Favorito:</label>
                    <input type="text" name="jogo_favorito" id="jogo_favorito" name="jogo"
                    list="jogos" placeholder="Digite seu jogo favorito no Roblox" >
                    <datalist id="jogos">
                        <option value="Adopt Me!">
                        <option value="Dress to Impress">
                        <option value="Tower of Hell">
                        <option value="Arsenal">
                        <option value="Murder Mystery 2">
                    </datalist>
                    <br><br>
                    <input type="submit" value="Cadastrar" style="width: 200px; height: 60px;">
                    <br>
                    <br>
                </form>
                <fieldset>

            </article>
        </td>
        <td width="25%" align="center">
            <aside>
                <img src="" alt="Imagem 2" width="100%">
            </aside>
        </td>
    </tr>
</table>
</main>
</body>
</html>
